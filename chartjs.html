<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementando o ChartJs</title>

    <style>
        .dashboard {
            display: flex;
            gap: 60px;
        }

        .grafico {
            flex: 1;
            height: 400px;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <div class="grafico">
            <canvas id="myChart"></canvas>
        </div>

        <div class="grafico">
            <canvas id="myChart2"></canvas>
        </div>
    </div>

</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const ctx = document.getElementById('myChart');

    const ctx2 = document.getElementById('myChart2');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
            datasets: [
                { label: 'Temperatura', data: [30, 29, 28, 25, 22, 23], borderColor: 'red', borderWidth: 2 },
                { label: 'Umidade', data: [80, 82, 80, 85, 80, 83], borderColor: 'blue', borderWidth: 2 }
            ]
        },
        options: {
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    new Chart(ctx2, {
        type: 'bar',
        data: {
            labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
            datasets: [
                { label: 'Temperatura', data: [30, 29, 28, 25, 22, 23], },
                { label: 'Umidade', data: [80, 82, 80, 85, 80, 83], }
            ]
        },
        options: {
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

</script>
